name: API - Karate

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a ejecutar, incluyendo @ (ej.: @patch, @authorization o @regression)'
        required: true
        default: '@regression'
        type: string

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Run smoke on pull requests
        if: github.event_name == 'pull_request'
        run: mvn --batch-mode --no-transfer-progress test -Dapi.tags=@smoke
      - name: Run regression on push or nightly execution
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: mvn --batch-mode --no-transfer-progress test
      - name: Run manual tests by tag
        if: github.event_name == 'workflow_dispatch'
        env:
          API_TAG: ${{ inputs.tag }}
        run: mvn --batch-mode --no-transfer-progress test "-Dapi.tags=$API_TAG"
      - name: Upload reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-karate-${{ github.run_attempt }}
          path: |
            api/target/karate-reports/
            api/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
